<!doctype html>
<html>
  <head>
    <title>Sound Advice</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/images/foodie.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <script src="/js/post_new.js" defer></script>
    <script src="/js/shared.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/"><img id="logo" src="/images/logo.png" /></a>
      <h1>Sound Advice</h1>
      <div class="dropdown">
        <button id="login_link" href="#">Username <i class="fa fa-caret-down"></i></button>
        <div class="dropdown-content">
          <a href="/profile">Profile</a>
          <a href="/admin/approval">Admin Panel</a>
          <a id="logout_btn">Log out</a>
        </div>
      </div>
    </header>

    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li class="active"><a href="/post/new">New Post</a></li>
        <li><a href="/my-posts">My Posts</a></li>
      </ul>
    </nav>

    <main>
      <section>
        <h2>New Post</h2>

        <form action="/api/posts" method="post" id="postForm">
          <fieldset>
            <legend>Write your post</legend>

            <label for="title_field">Title:</label>
            <input id="title_field" name="title_field" type="text" placeholder="Post title..." required />

            <label for="content_field">Content:</label>
            <textarea
              id="content_field"
              name="content_field"
              placeholder="Write your thoughts here..."
              required
            ></textarea>

            <button type="submit" id="post_btn">Post</button>
          </fieldset>
        </form>

        <p><a href="/">Cancel</a></p>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
