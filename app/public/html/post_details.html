<!doctype html>
<html>
  <head>
    <title>Sound Advice</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/images/foodie.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <!-- hash set to font-awesome 4.7.0 so if CDN file ever modified, it wont be loaded -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
      integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN"
      crossorigin="anonymous"
    />
    <script src="/js/post_details.js" defer></script>
    <script src="/js/shared.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/"><img id="logo" src="/images/logo.png" /></a>
      <h1>Sound Advice</h1>
      <a id="login_btn" class="hidden" href="/sign-in">Log in</a>
      <div class="dropdown hidden" id="user_dropdown">
        <button id="login_link">Username <i class="fa fa-caret-down"></i></button>
        <div class="dropdown-content">
          <a href="/profile">Profile</a>
          <a class="hidden" href="/admin/approval" id="admin_panel_link">Admin Panel</a>
          <a id="logout_btn">Log out</a>
        </div>
      </div>
    </header>

    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/search">Search Posts</a></li>
        <li><a href="/my-posts">My Posts</a></li>
      </ul>
    </nav>

    <main>
      <section id="postView">
        <div id="postActions" class="hidden">
          <a id="edit_btn" class="link_btn" href="#">Edit</a>
          <button id="delete_btn" class="link_btn">Delete</button>
        </div>

        <h2 id="postTitle">Post Title</h2>
        <p id="postStatus" class="hidden"></p>
        <p id="postMeta">Posted by <span id="postAuthor">username</span></p>
        <div id="postContent">
          <p>Post content goes here.</p>
        </div>
      </section>

      <section id="commentsSection">
        <h3>Comments</h3>
        <div id="commentsList"></div>

        <p id="loginToComment" class="hidden"><a href="/sign-in">Log in</a> to leave a comment.</p>

        <form id="commentForm" class="hidden">
          <label for="comment_field">Leave a comment:</label>
          <textarea
            id="comment_field"
            name="comment_field"
            placeholder="Write your comment..."
            maxlength="2000"
          ></textarea>
          <button type="submit">Submit</button>
        </form>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
