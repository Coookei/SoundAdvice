<!doctype html>
<html>
  <head>
    <title>Sound Advice - Sign Up</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/images/foodie.ico" />
    <link rel="stylesheet" href="/css/style.css" />

    <!-- purposely do NOT add SRI hash here. Cloudflare updates this script regularly and does not post a pinned hash,
      so an integrity attribute wld break widget on every update. The CSP script-src restricts loading to challenges.cloudflare.com anyways. -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <script src="/js/signup.js" defer></script>
    <script src="/js/shared.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/"><img id="logo" src="/images/logo.png" /></a>
      <h1>Welcome to Sound Advice!</h1>
    </header>
    <main>
      <p>Create an account to get started.</p>

      <form id="signup_form">
        <label for="username_input">Username:</label>
        <input type="text" id="username_input" name="username_input" placeholder="Choose a username..." />

        <label for="email_input">Email:</label>
        <input type="email" id="email_input" name="email_input" placeholder="Enter your email..." />

        <label for="password_input">Password:</label>
        <input type="password" id="password_input" name="password_input" placeholder="Choose a password..." />

        <label for="confirm_password_input">Confirm Password:</label>
        <input
          type="password"
          id="confirm_password_input"
          name="confirm_password_input"
          placeholder="Confirm your password..."
        />

        <div class="cf-turnstile" data-sitekey="0x4AAAAAADMrRCoN44VoTMZs"></div>

        <button id="signup_btn" type="submit">Sign up</button>
      </form>

      <p>Already have an account? <a href="/sign-in">Log in here</a></p>
    </main>
  </body>
</html>
