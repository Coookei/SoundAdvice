<!doctype html>
<html>
  <head>
    <title>Sound Advice - Sign In</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/images/foodie.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/signin.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/"><img id="logo" src="/images/logo.png" /></a>
      <h1>Welcome to Sound Advice!</h1>
    </header>
    <main>
      <p>Please enter your email and password to continue.</p>

      <form id="login_form">
        <label for="email_input">Email:</label>
        <input type="email" id="email_input" name="email_input" placeholder="Please enter your email..." />

        <label for="password_input">Password:</label>
        <input type="password" id="password_input" name="password_input" placeholder="Please enter your password..." />

        <button id="login_btn" type="submit">Log in</button>
      </form>

      <p><a href="/forgot-password">Forgot password?</a></p>

      <button>
        <a href="/sign-in/magic-link">Sign in with a magic email link instead</a>
      </button>

      <p>Don't have an account? <a href="/sign-up">Sign up here</a></p>
    </main>
  </body>
</html>
