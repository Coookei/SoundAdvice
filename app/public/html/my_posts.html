<!doctype html>
<html>
  <head>
    <title>Sound Advice</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/images/foodie.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <script src="/js/my_posts.js" defer></script>
    <script src="/js/shared.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/"><img id="logo" src="/images/logo.png" /></a>
      <h1>Sound Advice</h1>
      <div class="dropdown">
        <button id="login_link" href="#">Username <i class="fa fa-caret-down"></i></button>
        <div class="dropdown-content">
          <a href="/profile">Profile</a>
          <a href="/admin/approval">Admin Panel</a>
          <a id="logout_btn" href="/sign-in">Log out</a>
        </div>
      </div>
    </header>

    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/post/new">New Post</a></li>
        <li><a href="/my-posts">My Posts</a></li>
      </ul>
    </nav>

    <main>
      <section id="myPosts">
        <h2>Your Posts</h2>
        <p>See all the posts you've made so far.</p>
        <p><a class="link_btn" href="/post/new">New Post</a></p>

        <i class="fa fa-search" aria-hidden="true"></i>
        <input class="search_bar" id="search" name="search" type="text" placeholder="Search your posts..." />
      </section>
    </main>
  </body>
</html>
