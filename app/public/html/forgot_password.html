<!doctype html>
<html>
  <head>
    <title>Sound Advice - Forgot Password</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/images/foodie.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/forgot_password.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/"><img id="logo" src="/images/logo.png" /></a>
      <h1>Forgot your password?</h1>
    </header>
    <main>
      <p>Enter your email and we'll send you a code.</p>

      <form id="forgot_form">
        <label for="email_input">Email:</label>
        <input type="email" id="email_input" name="email_input" placeholder="Please enter your email..." />

        <button id="send_code_btn" type="submit">Send Code</button>
      </form>

      <p><a href="/sign-in">Back to sign in</a></p>
    </main>
  </body>
</html>
