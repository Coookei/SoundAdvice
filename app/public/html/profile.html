<!doctype html>
<html>
  <head>
    <title>Sound Advice</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/images/foodie.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <script src="/js/profile.js" defer></script>
    <script src="/js/shared.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/"><img id="logo" src="/images/logo.png" /></a>
      <h1>Sound Advice</h1>
      <a id="login_btn" href="/sign-in" style="display: none">Log in</a>
      <div class="dropdown" id="user_dropdown" style="display: none">
        <button id="login_link">Username <i class="fa fa-caret-down"></i></button>
        <div class="dropdown-content">
          <a href="/profile">Profile</a>
          <a href="/admin/approval" id="admin_panel_link" style="display: none">Admin Panel</a>
          <a id="logout_btn">Log out</a>
        </div>
      </div>
    </header>

    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/search">Search Posts</a></li>
        <li><a href="/my-posts">My Posts</a></li>
      </ul>
    </nav>

    <main class="profile-container">
      <section class="profile-header">
        <div class="profile-banner"></div>

        <h2 id="profile_username">Username</h2>

        <img id="profile_picture" class="profile-pic" alt="Profile picture" />

        <div class="pfp-controls">
          <input type="file" id="pfp_input" accept="image/*" />
          <button id="upload_pfp_btn">Update Profile Picture</button>
        </div>

        <div class="profile-info">
          <p id="profile_email"></p>
          <p id="profile_joined"></p>
          <p id="profile_bio"></p>
        </div>
      </section>

      <section class="profile-edit">
        <h3>Edit Profile</h3>

        <!-- BIO -->
        <div class="edit-row">
          <textarea id="bio_input" placeholder="Update your bio"></textarea>
          <button id="save_bio_btn">Save Bio</button>
        </div>

        <!-- Password -->
        <div class="edit-row">
          <input type="password" id="current_password" placeholder="Current Password" />
        </div>
        <div class="edit-row">
          <input type="password" id="new_password" placeholder="New Password" />
          <button id="request_password_btn">Send Code</button>
        </div>
        <div class="edit-row" id="password_code_row" style="display: none">
          <input type="text" id="password_code" placeholder="Enter code from email" maxlength="6" />
          <button id="confirm_password_btn">Update Password</button>
        </div>
      </section>

      <section class="profile-posts">
        <h3>User Posts</h3>
        <div id="posts_container"></div>
      </section>
    </main>
  </body>
</html>
