<!doctype html>
<html>
  <head>
    <title>Sound Advice Admin</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/images/foodie.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <!-- hash set to font-awesome 4.7.0 so if CDN file ever modified, it wont be loaded -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
      integrity="sha384-wvfXpqpZZVQGK6TAh5PVlGOfQNHSoD2xbE+QkPxCAFlNEevoEH3Sl0sibVcOQVnN"
      crossorigin="anonymous"
    />
    <script src="/js/admin_users.js" defer></script>
    <script src="/js/shared.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/"><img id="logo" src="/images/logo.png" /></a>
      <h1>Admin Dashboard</h1>
      <a id="login_btn" class="hidden" href="/sign-in">Log in</a>
      <div class="dropdown hidden" id="user_dropdown">
        <button id="login_link">Username <i class="fa fa-caret-down"></i></button>
        <div class="dropdown-content">
          <a href="/profile">Profile</a>
          <a class="hidden" href="/admin/approval" id="admin_panel_link">Admin Panel</a>
          <a id="logout_btn">Log out</a>
        </div>
      </div>
    </header>

    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/admin/approval">Post Approval</a></li>
        <li class="active"><a href="/admin/users">User Management</a></li>
        <li><a href="/admin/logs">Audit Logs</a></li>
      </ul>
    </nav>

    <main>
      <section id="userList">
        <h2>Users</h2>
        <p>All registered users. Emails are masked for security and privacy.</p>
        <table id="usersTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>Username</th>
              <th>Email</th>
              <th>Admin</th>
              <th>Joined</th>
            </tr>
          </thead>
          <tbody id="usersBody"></tbody>
        </table>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
