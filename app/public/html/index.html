<!doctype html>
<html>
  <head>
    <title>Sound Advice</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/images/foodie.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <script src="/js/index.js" defer></script>
    <script src="/js/shared.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/"><img id="logo" src="/images/logo.png" /></a>
      <h1>Sound Advice</h1>
      <a id="login_btn" href="/sign-in" style="display: none">Log in</a>
      <div class="dropdown" id="user_dropdown" style="display: none">
        <button id="login_link">Username <i class="fa fa-caret-down"></i></button>
        <div class="dropdown-content">
          <a href="/profile">Profile</a>
          <a href="/admin/approval" id="admin_panel_link" style="display: none">Admin Panel</a>
          <a id="logout_btn">Log out</a>
        </div>
      </div>
    </header>

    <nav>
      <ul>
        <li class="active"><a href="/">Home</a></li>
        <li><a href="/post/new">New Post</a></li>
        <li><a href="/my-posts">My Posts</a></li>
      </ul>
    </nav>

    <main>
      <section id="postsList">
        <h2>Latest Posts</h2>

        <i class="fa fa-search" aria-hidden="true"></i>
        <input class="search_bar" id="search" name="search" type="text" placeholder="Search posts..." />

        <p><a class="link_btn" href="/post/new">New Post</a></p>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
