<!doctype html>
<html>
  <head>
    <title>Sound Advice - Reset Password</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/images/foodie.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/forgot_password_reset.js" defer></script>
    <script src="/js/shared.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/"><img id="logo" src="/images/logo.png" /></a>
      <h1>Choose a new password</h1>
    </header>
    <main>
      <form id="reset_form">
        <label for="password_input">New Password:</label>
        <input type="password" id="password_input" name="password_input" placeholder="New password..." minlength="8" />

        <label for="confirm_input">Confirm Password:</label>
        <input type="password" id="confirm_input" name="confirm_input" placeholder="Confirm new password..." minlength="8" />

        <button id="reset_btn" type="submit">Update Password</button>
      </form>
    </main>
  </body>
</html>
